name: Publicar API de compatibilidade
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'netlify/**'
      - 'netlify.toml'
      - 'src/**'
      - '!src/catalog-job.ts'
      - 'public/**'
      - 'package*.json'
      - '.github/workflows/api-netlify.yml'
concurrency:
  group: api-netlify-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npx --yes netlify-cli@26.1.0 deploy --no-build --prod --site "$NETLIFY_API_SITE_ID"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_API_SITE_ID: ${{ secrets.NETLIFY_API_SITE_ID }}
